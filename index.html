<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>T-Time Multi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap');
        :root { 
            --bg: #1a1a1a; --card: #262626; --primary: #c9a063; --accent: #e63946; --success: #2a9d8f; --text: #f0f0f0;
            --font-gyosho: 'Klee One', serif;
        }
        body { font-family: var(--font-gyosho); background: var(--bg); color: var(--text); padding: 10px 5px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); border-radius: 25px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(201, 160, 99, 0.2); text-align: center; display: flex; flex-direction: column; }
        
        h1 { font-size: 2rem; color: var(--primary); margin: 0 0 5px 0; font-weight: 600; letter-spacing: 3px; }
        
        .multi-tabs { display: flex; gap: 6px; margin: 5px 0; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 8px 3px; font-size: 1.15rem; border: none; border-radius: 6px; background: transparent; color: #777; cursor: pointer; font-family: var(--font-gyosho); font-weight: bold; position: relative; }
        .tab-btn.tab-active { background: #333; color: var(--primary); border: 1px solid rgba(201, 160, 99, 0.3); }
        .tab-badge { width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 4px; right: 4px; display: none; }
        
        .mode-switch { display: flex; gap: 6px; margin-bottom: 8px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
        .mode-btn { flex: 1; padding: 6px; border-radius: 6px; border: none; background: transparent; color: #777; cursor: pointer; font-family: var(--font-gyosho); font-size: 1.15rem; font-weight: bold; transition: all 0.2s; }
        .mode-active { background: #333; color: var(--primary); border: 1px solid rgba(201, 160, 99, 0.3); }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-group { flex: 1; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 12px; text-align: left; }
        label { display: block; font-size: 0.75rem; color: var(--primary); }
        input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #444; color: white; font-size: 1.3rem; outline: none; font-family: var(--font-gyosho); }
        
        .main-btn { background: var(--primary); color: #1a1a1a; border: none; width: 100%; padding: 14px; border-radius: 30px; font-size: 1.3rem; font-weight: bold; cursor: pointer; font-family: var(--font-gyosho); margin-top: 5px; }
        
        .clear-btn { background: var(--accent); color: white; border: none; width: 100%; padding: 8px; border-radius: 20px; font-size: 1.4rem; font-weight: bold; cursor: pointer; font-family: var(--font-gyosho); margin-top: 5px; }

        .result { margin-top: 10px; }
        .finish-box { background: rgba(230, 57, 70, 0.05); padding: 12px 12px; border-radius: 15px; position: relative; }
        
        .theory-header { position: relative; display: flex; justify-content: center; align-items: center; min-height: 28px; margin-bottom: 2px; width: 100%; }
        .theory-title-wrapper { font-size: 0.8rem; color: var(--primary); text-align: center; }
        
        .pause-reset-btn { position: absolute; right: 0; background: rgba(201, 160, 99, 0.15); color: var(--primary); border: 1px solid rgba(201, 160, 99, 0.4); padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; font-family: var(--font-gyosho); transition: all 0.2s; white-space: nowrap; }
        .pause-reset-btn:active { background: var(--primary); color: #1a1a1a; }

        .time-label { font-size: 0.8rem; color: var(--primary); margin-top: 4px; margin-bottom: 2px; }
        .time-label.practice-color { color: var(--success); }
        
        .time-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-bottom: 2px; }
        .time-val.practice-color { color: var(--success); }
        
        .progress-container { margin: 8px 0 2px 0; text-align: left; }
        .bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 3px 0 3px 0; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
        .bar-shortest { background: var(--primary); }
        .bar-practice { background: var(--success); }
        
        .bar-label-row { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .bar-label-row.practice-color { color: var(--success); margin-bottom: 0; }
        
        .milestones { display: flex; justify-content: space-around; margin: 10px 0; background: rgba(255,255,255,0.05); padding: 8px 4px; border-radius: 12px; font-size: 0.95rem; }
        .milestones b { font-size: 1.05rem; }
        
        .analysis-area { display: flex; justify-content: space-around; margin: 8px 0; font-size: 0.95rem; color: #aaa; }
        .analysis-area b { font-size: 1.05rem; }

        .clear-all-wrap { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .clear-all-btn { background: rgba(230, 57, 70, 0.2); color: var(--accent); border: 1px solid rgba(230, 57, 70, 0.4); width: 100%; padding: 10px; border-radius: 20px; font-size: 1rem; font-weight: bold; cursor: pointer; font-family: var(--font-gyosho); }
    </style>
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
<div class="container">
    <h1>T-Time</h1>
    <div class="multi-tabs">
        <button id="tab1" class="tab-btn tab-active" onclick="switchTab(1)">壱<span id="b1" class="tab-badge"></span></button>
        <button id="tab2" class="tab-btn" onclick="switchTab(2)">弐<span id="b2" class="tab-badge"></span></button>
        <button id="tab3" class="tab-btn" onclick="switchTab(3)">参<span id="b3" class="tab-badge"></span></button>
    </div>

    <div class="mode-switch">
        <button id="modePct" class="mode-btn mode-active" onclick="changeMode('pct')">％</button>
        <button id="modeNum" class="mode-btn" onclick="changeMode('num')">個数</button>
    </div>

    <div class="input-row">
        <div class="input-group"><label>現在の値</label><input type="number" id="sVal" value="3"></div>
        <div class="input-group"><label>次に押す値</label><input type="number" id="eVal" value="4"></div>
    </div>
    <div id="numInputArea" class="input-group" style="display:none; margin-bottom:8px;">
        <label>合計目標値</label><input type="number" id="totalVal" value="100">
    </div>

    <button id="mainBtn" class="main-btn" onclick="handle()">ここから測る</button>
    <button id="clearBtn" class="clear-btn" style="display:none;" onclick="resetCurrentTab()">クリア</button>

    <div id="resultArea" class="result" style="display:none;">
        <div class="finish-box">
            <div class="theory-header">
                <div class="theory-title-wrapper">最短完了予測</div>
                <button id="pauseResetBtn" class="pause-reset-btn" onclick="pauseAndReset()">一時停止再設定</button>
            </div>
            <div id="theoryTime" class="time-val">--/-- --:--</div>
            
            <div class="progress-container" style="margin-bottom: 12px;">
                <div class="bar-bg"><div id="barShortest" class="bar-fill bar-shortest"></div></div>
                <div class="bar-label-row">
                    <span id="countdownShortest">最短: あと--分--秒</span>
                    <span id="progressTextShortest">0%</span>
                </div>
            </div>
            
            <div class="time-label practice-color" style="margin-top: 10px;">推定完了目処</div>
            <div id="practiceTime" class="time-val practice-color">--/-- --:--</div>
            
            <div class="progress-container">
                <div class="bar-bg"><div id="barPractice" class="bar-fill bar-practice"></div></div>
                <div class="bar-label-row practice-color">
                    <span id="countdownPractice">目処: あと--分--秒</span>
                    <span id="progressTextPractice">0%</span>
                </div>
            </div>
        </div>
        
        <div class="milestones">
            <div>10%<br><b id="m10" style="color:var(--primary);">--:--</b></div>
            <div>50%<br><b id="m50" style="color:var(--primary);">--:--</b></div>
            <div>90%<br><b id="m90" style="color:var(--primary);">--:--</b></div>
        </div>
        <div class="analysis-area">
            <div>1分進捗<br><b id="vPerMin" style="color:var(--primary);">--</b></div>
            <div>1単位<br><b id="vPerUnit" style="color:var(--primary);">--</b></div>
            <div>全体<br><b id="vFull" style="color:var(--primary);">--</b></div>
        </div>
    </div>

    <div class="clear-all-wrap">
        <button id="clearAllBtn" class="clear-all-btn" onclick="clearAll()">全てクリア（全タブ初期化）</button>
    </div>
</div>

<script>
    let cur = 1;
    let t = {};
    
    function loadStorage() {
        let saved = localStorage.getItem('ttime');
        try {
            t = JSON.parse(saved) || {};
        } catch(e) {
            t = {};
        }
        [1, 2, 3].forEach(i => {
            if (!t[i] || typeof t[i] !== 'object') t[i] = {};
            if (!t[i].p) t[i].p = 'R'; 
            if (!t[i].m) t[i].m = 'pct'; 
        });
    }
    loadStorage();
    
    function switchTab(n) {
        document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('tab-active', i+1===n));
        cur = n; 
        render();
    }

    function changeMode(m) { 
        t[cur].m = m; 
        updateModeUI(m);
        localStorage.setItem('ttime', JSON.stringify(t));
    }

    function updateModeUI(m) {
        document.getElementById('modePct').classList.toggle('mode-active', m==='pct');
        document.getElementById('modeNum').classList.toggle('mode-active', m==='num');
        document.getElementById('numInputArea').style.display = m==='num'?'block':'none';
    }
    
    function render() {
        const d = t[cur];
        updateModeUI(d.m);
        document.getElementById('resultArea').style.display = d.p==='F'?'block':'none';
        
        const mainBtn = document.getElementById('mainBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        if (d.p === 'F') {
            mainBtn.style.display = 'none';
        } else {
            mainBtn.style.display = 'block';
            clearBtn.style.display = 'none';
            mainBtn.innerText = d.p==='R'?'ここから測る':'確定して計算';
        }
        
        if (d.p === 'R') {
            document.getElementById('sVal').value = 3;
            document.getElementById('eVal').value = 4;
            document.getElementById('totalVal').value = 100;
        } else {
            document.getElementById('sVal').value = d.s;
            document.getElementById('eVal').value = d.e;
            if(d.total && d.m==='num') document.getElementById('totalVal').value = d.total;
        }

        updateBadges();
    }

    function updateBadges() {
        const now = Date.now();
        [1,2,3].forEach(i => {
            const badge = document.getElementById('b'+i);
            const d = t[i];
            
            if (d.p === 'M') { 
                badge.style.display = 'block';
                badge.style.backgroundColor = 'var(--accent)'; 
            } else if (d.p === 'F' && d.speed) {
                let prac = d.confirm + ((d.total - d.e) / d.speed) * 1.4;
                if (prac - now > 0) {
                    badge.style.display = 'block';
                    badge.style.backgroundColor = 'var(--accent)'; 
                } else {
                    badge.style.display = 'block';
                    badge.style.backgroundColor = 'var(--success)'; 
                }
            } else {
                badge.style.display = 'none';
            }
        });
    }

    function handle() {
        let d = t[cur];
        if(d.p==='R') {
            d.s = +document.getElementById('sVal').value; d.e = +document.getElementById('eVal').value;
            d.total = d.m==='pct'?100:+document.getElementById('totalVal').value;
            d.start = Date.now(); d.p = 'M';
        } else if(d.p==='M') {
            d.confirm = Date.now(); 
            let valDiff = d.e - d.s;
            let timeDiff = d.confirm - d.start;
            d.speed = timeDiff > 0 ? (valDiff / timeDiff) : 0.0001;
            d.p = 'F';
        }
        localStorage.setItem('ttime', JSON.stringify(t)); render();
    }

    function pauseAndReset() {
        let d = t[cur];
        if (d.p === 'F') {
            const nextS = +document.getElementById('sVal').value;
            const nextE = +document.getElementById('eVal').value;
            const nextTotal = d.m==='pct'?100:+document.getElementById('totalVal').value;

            d.p = 'R';
            localStorage.setItem('ttime', JSON.stringify(t));
            render();
            
            document.getElementById('sVal').value = nextS;
            document.getElementById('eVal').value = nextE;
            document.getElementById('totalVal').value = nextTotal;
        }
    }

    function resetCurrentTab() {
        let d = t[cur];
        d.p = 'R';
        localStorage.setItem('ttime', JSON.stringify(t));
        render();
    }

    function clearAll() {
        if(confirm("警告：すべてのタブの計測データを完全に消去し、最初の状態に戻します。よろしいですか？")) {
            localStorage.removeItem('ttime');
            loadStorage();
            cur = 1;
            switchTab(1);
        }
    }

    function formatDateTime(ts) {
        if (isNaN(ts)) return "--/-- --:--";
        let date = new Date(ts);
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        let hr = String(date.getHours()).padStart(2, '0');
        let min = String(date.getMinutes()).padStart(2, '0');
        return `${m}/${d} ${hr}:${min}`;
    }

    function formatCountdown(diffMs) {
        if (diffMs <= 0) return "完了！";
        let totalSec = Math.floor(diffMs / 1000);
        let sec = totalSec % 60;
        let totalMin = Math.floor(totalSec / 60);
        let min = totalMin % 60;
        let totalHr = Math.floor(totalMin / 60);
        let hr = totalHr % 24;
        let day = Math.floor(totalHr / 24);

        if (day > 0) {
            return `あと ${day}日${hr}時間${min}分${sec}秒`;
        } else if (hr > 0) {
            return `あと ${hr}時間${min}分${sec}秒`;
        } else {
            return `あと ${min}分${sec}秒`;
        }
    }

    render();

    setInterval(() => {
        updateBadges(); 
        
        let d = t[cur];
        if(d && d.p==='F' && d.speed) {
            let now = Date.now(), speed = d.speed, b = 1.4;
            let theory = d.confirm + (d.total - d.e) / speed;
            let prac = d.confirm + ((d.total - d.e) / speed) * b;
            
            let totalDurationShortest = theory - d.confirm;
            let progressShortest = totalDurationShortest > 0 ? ((now - d.confirm) / (totalDurationShortest/100)) + ((d.e/d.total)*100) : 100;
            progressShortest = Math.max(0, Math.min(100, isNaN(progressShortest) ? 0 : progressShortest));

            let totalDurationPractice = prac - d.confirm;
            let progressPractice = totalDurationPractice > 0 ? ((now - d.confirm) / (totalDurationPractice/100)) + ((d.e/d.total)*100) : 100;
            progressPractice = Math.max(0, Math.min(100, isNaN(progressPractice) ? 0 : progressPractice));

            if(!isNaN(theory) && !isNaN(prac)) {
                document.getElementById('theoryTime').innerText = formatDateTime(theory);
                document.getElementById('practiceTime').innerText = formatDateTime(prac);
                
                document.getElementById('barShortest').style.width = progressShortest + "%";
                document.getElementById('progressTextShortest').innerText = progressShortest.toFixed(1) + "%";
                
                document.getElementById('barPractice').style.width = progressPractice + "%";
                document.getElementById('progressTextPractice').innerText = progressPractice.toFixed(1) + "%";
                
                let diffShortest = theory - now;
                let diffPractice = prac - now;
                
                document.getElementById('countdownShortest').innerText = "最短: " + formatCountdown(diffShortest);
                document.getElementById('countdownPractice').innerText = "目処: " + formatCountdown(diffPractice);
                
                const clearBtn = document.getElementById('clearBtn');
                
                if (diffPractice > 0) {
                    clearBtn.style.display = 'none';
                } else {
                    clearBtn.style.display = 'block';
                }
                
                const calc = p => {
                    let timeVal = d.confirm + (d.total*p - d.e)/speed;
                    return isNaN(timeVal) ? "--:--" : new Date(timeVal).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
                };
                document.getElementById('m10').innerText = calc(0.1);
                document.getElementById('m50').innerText = calc(0.5);
                document.getElementById('m90').innerText = calc(0.9);
                document.getElementById('vPerMin').innerText = (speed*60000).toFixed(1);
                document.getElementById('vPerUnit').innerText = (1/speed/1000).toFixed(1)+"秒";
                document.getElementById('vFull').innerText = Math.floor((theory-d.start)/60000)+"分";
            }
        }
    }, 1000);
</script>
</body>
</html>
